[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csrf-kit"
version = "0.1.0"
description = "Simple Flask CSRF protection with a Python standard-library token engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Flask>=3.1,<4", "MarkupSafe>=2.1", "Werkzeug>=3.1,<4"]
keywords = ["flask", "csrf", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "csrf-kit"
version = "0.1.0"
description = "Simple Flask CSRF protection with a Python standard-library token engine."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["Flask>=3.1,<4", "MarkupSafe>=2.1", "Werkzeug>=3.1,<4"]
keywords = ["flask", "csrf", "security"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Flask",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/nullbyt3zx01/csrf-kit"
Repository = "https://github.com/nullbyt3zx01/csrf-kit"
Issues = "https://github.com/nullbyt3zx01/csrf-kit/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.9", "build>=1.2", "twine>=6"]

[tool.hatch.build.targets.wheel]
packages = ["src/csrf_kit"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "LICENSE", "SECURITY.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]


